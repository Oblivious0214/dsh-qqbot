# dsh-qqbot 只新增两行：host 层登记服务，以及 qqbot 预设。
# 不改任何已有行，不写 agent-preset-registry 的 default / selectedDefault。
- insert:
    - id: qqbot
      name: dsh-qqbot

    - id: preset-qqbot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qqbot
        name: QQ Bot
        order: 50
        # 不挂 bash、pwsh、文件读写等工具（docs/architecture.md 第 2 节）。
        plugins:
          # 系统提示词由 dsh-qqbot/prompt 的 complete section 独占，这里只关掉可选 runtime context
          # （沙箱、审批、DSH 源码目录、Web GUI 地址）。工作目录和 qqbot:runtime 是 required，仍保留。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: ''
              includeRuntimeContext: false
          - id: qqbot-prompt
            name: dsh-qqbot/prompt
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
